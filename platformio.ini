; BDLMinerV1 - lottery Bitcoin miner for M5StickC Plus2 and ESP32 boards
;
; Build one board :   pio run -e m5stickc-plus2
; Flash + monitor :   pio run -e m5stickc-plus2 -t upload -t monitor
; Build default board: pio run

[platformio]
default_envs = m5stickc-plus2

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two 1.9 MB app slots: firmware updates from the web dashboard (OTA).
; 8/16 MB boards override this; 4 MB boards whose firmware is bigger use
; huge_app.csv (one 3 MB slot, USB updates only).
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
extra_scripts = pre:tools/fw_env.py
build_unflags =
    -Os
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
; Arduino loop (screen, web server, buttons) and WiFi events on core 0, so
; that core 1 belongs to the hardware SHA miner alone on dual-core chips.
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"1.3.1\"
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
    knolleary/PubSubClient@2.8

; ---------------------------------------------------------------------------
; Shared fragments
; ---------------------------------------------------------------------------

[m5unified]
lib_deps =
    ${env.lib_deps}
    m5stack/M5GFX@0.2.31
    m5stack/M5Unified@0.2.24

[lgfx]
lib_deps =
    ${env.lib_deps}
    m5stack/M5GFX@0.2.31

; ---------------------------------------------------------------------------
; M5Stack boards (M5Unified detects the exact model at runtime)
; ---------------------------------------------------------------------------

; M5StickC Plus2 : ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM, ST7789V2 135x240
[env:m5stickc-plus2]
board = m5stick-c
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
lib_deps = ${m5unified.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"M5StickC-Plus2\"
    -DDISPLAY_M5UNIFIED
    -DBG_HAS_240x135=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Any other ESP32 M5Stack device: StickC Plus, Core/Basic/Gray/Fire, Core2,
; Tough, Atom Lite/Matrix/Echo, Stamp Pico... (4 MB flash minimum)
[env:m5stack-esp32]
board = m5stack-core-esp32
board_build.partitions = huge_app.csv
lib_deps = ${m5unified.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"M5Stack-ESP32\"
    -DDISPLAY_M5UNIFIED

; ESP32-S3 M5Stack devices: AtomS3, AtomS3R, AtomS3 Lite, CoreS3, Cardputer,
; StampS3, Dial, DinMeter...
[env:m5stack-s3]
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
lib_deps = ${m5unified.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"M5Stack-S3\"
    -DDISPLAY_M5UNIFIED
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Third-party boards with a screen (M5GFX / LovyanGFX custom panels)
; ---------------------------------------------------------------------------

; LilyGO TTGO T-Display (ESP32, ST7789 135x240, buttons GPIO0 / GPIO35)
[env:lilygo-t-display]
board = esp32dev
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"T-Display\"
    -DDISPLAY_LGFX_T_DISPLAY
    -DBUTTON_A_PIN=35
    -DBUTTON_B_PIN=0

; LilyGO T-Display-S3 (ESP32-S3, ST7789 170x320 8-bit parallel, buttons 14 / 0)
[env:lilygo-t-display-s3]
board = lilygo-t-display-s3
board_build.partitions = default_16MB.csv
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"T-Display-S3\"
    -DDISPLAY_LGFX_T_DISPLAY_S3
    -DBUTTON_A_PIN=14
    -DBUTTON_B_PIN=0
    -DPOWER_ON_PIN=15

; ESP32-2432S028R "Cheap Yellow Display" (ESP32, ILI9341 320x240, BOOT button)
[env:esp32-2432s028r]
board = esp32dev
board_build.partitions = huge_app.csv
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"CYD-2432S028R\"
    -DDISPLAY_LGFX_CYD
    -DBUTTON_A_PIN=0
    -DLED_PIN=4
    -DLED_ACTIVE_LOW

; ---------------------------------------------------------------------------
; Headless boards (serial log + optional status LED, BOOT button)
; Add -DLED_PIN=<gpio> to build_flags if your board has a LED.
; ---------------------------------------------------------------------------

[env:esp32-headless]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32\"
    -DBUTTON_A_PIN=0
    -DLED_PIN=2

[env:esp32s3-headless]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-S3\"
    -DBUTTON_A_PIN=0

[env:esp32s2-headless]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-S2\"
    -DBUTTON_A_PIN=0

[env:esp32c3-headless]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-C3\"
    -DBUTTON_A_PIN=9
