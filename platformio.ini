; BDLMiner V2 - lottery Bitcoin miner for M5StickC Plus2 and ESP32 boards
;
; Build one board :   pio run -e m5stickc-plus2
; Flash + monitor :   pio run -e m5stickc-plus2 -t upload -t monitor
; Build default board: pio run

[platformio]
default_envs = m5stickc-plus2

[env]
; pioarduino 55.03.312 = Arduino-ESP32 3.3.12, ESP-IDF 5.5, GCC 14.2, which
; compiles C++ as -std=gnu++2b: C++23 under GCC 14. Needs PlatformIO Core 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two 1.9 MB app slots: firmware updates from GitHub and the web dashboard
; (OTA), on every 4 MB board since the firmware is built for size. 8/16 MB
; boards override this.
board_build.partitions = partitions/min_spiffs.csv
board_build.f_cpu = 240000000L
extra_scripts =
    pre:tools/fw_env.py
    pre:tools/optimize.py
build_unflags =
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
; Arduino loop (screen, web server, buttons) and WiFi events on core 0, so
; that core 1 belongs to the hardware SHA miner alone on dual-core chips.
; Built for size (-Os); tools/optimize.py builds the mining code with -O2.
; The cores come from sdkconfig (CONFIG_ARDUINO_RUN_CORE0 below): ESP-IDF's
; own sources (built with -Werror) would see -D twice on the S3 boards whose
; board files already define them.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"2.5.3\"
; ESP-IDF rebuilt with our own configuration (pioarduino hybrid compile, at
; the first build of each board). TLS 1.3 on (public-pool's API refuses TLS
; 1.2); IDF's default certificate bundle replaced by our 40 roots (the
; firmware passes the same ones at run time, src/tls_roots.h). What the
; firmware does not use is left out so that the 4 MB boards keep their two
; 1920 KB update slots: Bluetooth, Ethernet, IPv6, WPA-Enterprise, C++
; exceptions, the TLS server side, unused ciphers and curves, unused managed
; components; IDF built for size with silent assertions. mbedTLS PSK modes stay:
; Arduino's ssl_client.cpp does not build without them.
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_NONE=y
    '# CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL is not set'
    CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE=y
    CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE_PATH="assets/tls/roots.pem"
    '# CONFIG_BT_ENABLED is not set'
    '# CONFIG_BT_NIMBLE_ENABLED is not set'
    '# CONFIG_BT_CONTROLLER_ENABLED is not set'
    CONFIG_BT_CONTROLLER_DISABLED=y
    '# CONFIG_ETH_USE_ESP32_EMAC is not set'
    CONFIG_COMPILER_OPTIMIZATION_SIZE=y
    CONFIG_ARDUINO_RUN_CORE0=y
    '# CONFIG_ARDUINO_RUN_CORE1 is not set'
    CONFIG_ARDUINO_RUNNING_CORE=0
    CONFIG_ARDUINO_EVENT_RUN_CORE0=y
    '# CONFIG_ARDUINO_EVENT_RUN_CORE1 is not set'
    CONFIG_ARDUINO_EVENT_RUNNING_CORE=0
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
    '# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set'
    '# CONFIG_COMPILER_CXX_EXCEPTIONS is not set'
    '# CONFIG_ESP_ERR_TO_NAME_LOOKUP is not set'
    '# CONFIG_LWIP_IPV6 is not set'
    '# CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT is not set'
    '# CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA is not set'
    '# CONFIG_ESP_WIFI_SOFTAP_SAE_SUPPORT is not set'
    '# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set'
    '# CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE is not set'
    '# CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA is not set'
    '# CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA is not set'
    '# CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED is not set'
    '# CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED is not set'
    CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
    '# CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT is not set'
    '# CONFIG_MBEDTLS_TLS_SERVER is not set'
    '# CONFIG_MBEDTLS_CAMELLIA_C is not set'
    '# CONFIG_MBEDTLS_SSL_RENEGOTIATION is not set'
    '# CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK is not set'
    '# CONFIG_LWIP_PPP_SUPPORT is not set'
    '# CONFIG_LWIP_IPV4_NAPT is not set'
    '# CONFIG_ESP_WIFI_GMAC_SUPPORT is not set'
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/network_provisioning
    espressif/esp-dsp
    espressif/esp_modem
    espressif/esp32-camera
    espressif/libsodium
    espressif/esp-modbus
    espressif/qrcode
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/esp_rainmaker
    espressif/rmaker_common
    chmorgan/esp-libhelix-mp3
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17
    knolleary/PubSubClient@2.8

; ---------------------------------------------------------------------------
; Shared fragments
; ---------------------------------------------------------------------------

; PSRAM, found at run time (Arduino's psramInit(), a board without it boots as
; before), as Arduino-ESP32 2.x and 3.x ship it. pioarduino's ESP-IDF rebuild
; turns it off unless the board file declares PSRAM, which m5stick-c (the
; original StickC), esp32dev, m5stack-core-esp32 and the S2/S3 devkits do not:
; on 2.5.0 the M5StickC Plus2 lost its 2 MB and could no longer allocate TLS
; buffers. Boards that can carry PSRAM take this section; those that never do
; (T-Display, CYD, C3) keep the room on their 4 MB flash.
[psram]
custom_sdkconfig =
    ${env.custom_sdkconfig}
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    '# CONFIG_SPIRAM_BOOT_INIT is not set'

[m5unified]
lib_deps =
    ${env.lib_deps}
    m5stack/M5GFX@0.2.35
    m5stack/M5Unified@0.2.28

[lgfx]
lib_deps =
    ${env.lib_deps}
    m5stack/M5GFX@0.2.35

; ---------------------------------------------------------------------------
; M5Stack boards (M5Unified detects the exact model at runtime)
; ---------------------------------------------------------------------------

; M5StickC Plus2 : ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM, ST7789V2 135x240
[env:m5stickc-plus2]
board = m5stick-c
; Arduino-ESP32 3.x renamed the variant (m5stick_c -> m5stack_stickc).
board_build.variant = m5stack_stickc
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/default_8MB.csv
custom_sdkconfig = ${psram.custom_sdkconfig}
lib_deps = ${m5unified.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"M5StickC-Plus2\"
    -DDISPLAY_M5UNIFIED
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Any other ESP32 M5Stack device: StickC Plus, Core/Basic/Gray/Fire, Core2,
; Tough, Atom Lite/Matrix/Echo, Stamp Pico... (4 MB flash minimum)
[env:m5stack-esp32]
board = m5stack-core-esp32
; Arduino-ESP32 3.x renamed the variant (m5stack_core_esp32 -> m5stack_core).
board_build.variant = m5stack_core
custom_sdkconfig = ${psram.custom_sdkconfig}
lib_deps = ${m5unified.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"M5Stack-ESP32\"
    -DDISPLAY_M5UNIFIED

; ESP32-S3 M5Stack devices: AtomS3, AtomS3R, AtomS3 Lite, CoreS3, Cardputer,
; StampS3, Dial, DinMeter...
[env:m5stack-s3]
board = m5stack-stamps3
board_build.partitions = partitions/default_8MB.csv
custom_sdkconfig = ${psram.custom_sdkconfig}
lib_deps = ${m5unified.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"M5Stack-S3\"
    -DDISPLAY_M5UNIFIED
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Third-party boards with a screen (M5GFX / LovyanGFX custom panels)
; ---------------------------------------------------------------------------

; LilyGO TTGO T-Display (ESP32, ST7789 135x240, buttons GPIO0 / GPIO35)
[env:lilygo-t-display]
board = esp32dev
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"T-Display\"
    -DDISPLAY_LGFX_T_DISPLAY
    -DBUTTON_A_PIN=35
    -DBUTTON_B_PIN=0

; LilyGO T-Display-S3 (ESP32-S3, ST7789 170x320 8-bit parallel, buttons 14 / 0)
[env:lilygo-t-display-s3]
board = lilygo-t-display-s3
board_build.partitions = partitions/default_16MB.csv
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"T-Display-S3\"
    -DDISPLAY_LGFX_T_DISPLAY_S3
    -DBUTTON_A_PIN=14
    -DBUTTON_B_PIN=0
    -DPOWER_ON_PIN=15

; NerdNOS (experimental): one BM1397 ASIC on a board carrying a T-Display-S3.
; The T-Display-S3 runs the screen and drives the ASIC; see docs/hardware/nerdnos.md.
[env:nerdnos]
board = lilygo-t-display-s3
board_build.partitions = partitions/default_16MB.csv
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"NerdNOS\"
    -DBOARD_NERDNOS
    -DBOARD_ASIC
    -DDISPLAY_LGFX_T_DISPLAY_S3
    -DBUTTON_A_PIN=14
    -DBUTTON_B_PIN=0
    -DPOWER_ON_PIN=15

; ESP32-2432S028R "Cheap Yellow Display" (ESP32, ILI9341 320x240, BOOT button)
[env:esp32-2432s028r]
board = esp32dev
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"CYD-2432S028R\"
    -DDISPLAY_LGFX_CYD
    -DBUTTON_A_PIN=0
    -DLED_PIN=4
    -DLED_ACTIVE_LOW

; ---------------------------------------------------------------------------
; Headless boards (serial log + optional status LED, BOOT button)
; Add -DLED_PIN=<gpio> to build_flags if your board has a LED.
; ---------------------------------------------------------------------------

[env:esp32-headless]
board = esp32dev
custom_sdkconfig = ${psram.custom_sdkconfig}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32\"
    -DBUTTON_A_PIN=0
    -DLED_PIN=2

; Declared as 4 MB: many ESP32-S3 boards (Super Mini...) have only 4 MB, and an
; image whose header says 8 MB stops them at boot ("Detected size smaller than
; the size in the binary image header"). Larger chips run it as well.
[env:esp32s3-headless]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; The log goes to the native USB port (boards with only that one, such as the
; Super Mini) and to UART0 as well (DevKits, through their USB-serial chip).
custom_sdkconfig = ${psram.custom_sdkconfig}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-S3\"
    -DBUTTON_A_PIN=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLOG_MIRROR_UART0

[env:esp32s2-headless]
board = esp32-s2-saola-1
custom_sdkconfig = ${psram.custom_sdkconfig}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-S2\"
    -DBUTTON_A_PIN=0

; The log goes to the native USB port (boards with only that one, such as the
; Super Mini) and to UART0 as well (DevKits, through their USB-serial chip).
[env:esp32c3-headless]
board = esp32-c3-devkitm-1
; The C3 supports 160 MHz maximum; do not inherit the Xtensa boards' 240 MHz.
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-C3\"
    -DBUTTON_A_PIN=9
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLOG_MIRROR_UART0

; Bitaxe Gamma revision 601 only: ESP32-S3 N16R8, BM1370, SSD1306 128x32.
; Experimental native firmware. Requires a 5V >=4A barrel supply and working fan.
[env:bitaxe-gamma-601]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/default_16MB.csv
lib_deps = ${lgfx.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"Bitaxe-Gamma-601\"
    -DBOARD_GAMMA601
    -DBOARD_ASIC
    -DDISPLAY_LGFX_GAMMA601
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBUTTON_A_PIN=0
