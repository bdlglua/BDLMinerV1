# Host tests and a build of every board, on each push and pull request.
name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
  workflow_dispatch:

# Tests and builds only read the repository.
permissions:
  contents: read

jobs:
  web:
    # Playwright 1.56.1 supports this image; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/web/package-lock.json
      - run: npm ci --prefix test/web
      - run: test/web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix test/web
      - run: node test/web/test_hub.cjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio==6.2.0
      - run: python3 -m unittest discover -s test/tools -v
      - name: Native SV2 crypto test dependency
        run: |
          if ! python3 -c 'import ctypes.util; assert ctypes.util.find_library("sodium")'; then
            sudo apt-get update
            sudo apt-get install -y libsodium23
          fi
      - run: ./test/host/run.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [m5stickc-plus2, m5stack-esp32, m5stack-s3, lilygo-t-display, lilygo-t-display-s3,
              esp32-2432s028r, esp32-headless, esp32s3-headless, esp32s2-headless, esp32c3-headless, bitaxe-gamma-601, nerdnos]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-
      - run: pip install platformio==6.2.0
      # C++23 study (pioarduino hybrid compile): the first run rebuilds ESP-IDF
      # with custom_sdkconfig and copies it into the framework. Its own child
      # build may be refused (pioarduino's penv can carry PlatformIO
      # 6.2.0.post1, read as 6.2.0-post.1 < 6.2.0); the libraries are in place
      # by then, so the packaging below builds against them as usual.
      - name: Rebuild ESP-IDF for this board (custom_sdkconfig)
        run: pio run -e "${{ matrix.env }}" > build-idf.log 2>&1 || tail -40 build-idf.log
      - name: Build and package USB images from a clean checkout
        run: python3 tools/make_release.py --unsigned "${{ matrix.env }}"
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-ci-${{ matrix.env }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Physical display rendering regressions
        if: matrix.env == 'm5stickc-plus2'
        run: python3 tools/preview_display.py --check

      - name: Gamma 601 native 128x32 OLED rendering regressions
        if: matrix.env == 'bitaxe-gamma-601'
        run: python3 tools/preview_gamma_display.py --check

      - name: Experimental Gamma 601 USB build
        if: matrix.env == 'bitaxe-gamma-601'
        uses: actions/upload-artifact@v7
        with:
          name: bitaxe-gamma-601-experimental-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*/bitaxe-gamma-601-factory.bin
            release/*/bitaxe-gamma-601-firmware.bin
            release/*/SHA256SUMS.txt
            docs/hardware/bitaxe-gamma-601.md

      - name: M5StickC Plus2 dashboard test build
        if: matrix.env == 'm5stickc-plus2'
        uses: actions/upload-artifact@v7
        with:
          name: m5stickc-plus2-dashboard-test-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*/m5stickc-plus2-factory.bin
            release/*/m5stickc-plus2-firmware.bin
            release/*/SHA256SUMS.txt
            docs/audits/2026-10-27-m5-dashboard-load.md

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: unsigned-ci-*
          path: build-inputs
      - name: Independently validate every parallel build and OTA slot
        run: python3 tools/assemble_release.py --inputs build-inputs --unsigned
      - name: Prepare the offline Linux test kit
        run: python3 tools/make_beta_bundle.py
      - uses: actions/upload-artifact@v7
        with:
          name: v2-linux-test-kit
          path: .pio/v2-test-kit/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: verified-unsigned-v2-preview
          path: release/
          if-no-files-found: error
          retention-days: 7
