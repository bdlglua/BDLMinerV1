# Host tests and a build of every board, on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/web/package-lock.json
      - run: npm ci --prefix test/web
      - run: test/web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix test/web

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio==6.1.19
      - run: python3 -m unittest discover -s test/tools -v
      - name: Native SV2 crypto test dependency
        run: |
          if ! python3 -c 'import ctypes.util; assert ctypes.util.find_library("sodium")'; then
            sudo apt-get update
            sudo apt-get install -y libsodium23
          fi
      - run: ./test/host/run.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [m5stickc-plus2, m5stack-esp32, m5stack-s3, lilygo-t-display, lilygo-t-display-s3,
              esp32-2432s028r, esp32-headless, esp32s3-headless, esp32s2-headless, esp32c3-headless, bitaxe-gamma-601]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-
      - run: pip install platformio==6.1.19
      - name: Build and package USB images from a clean checkout
        run: python3 tools/make_release.py "${{ matrix.env }}"
      - name: Physical display rendering regressions
        if: matrix.env == 'm5stickc-plus2'
        run: python3 tools/preview_display.py --check

      - name: Experimental Gamma 601 USB build
        if: matrix.env == 'bitaxe-gamma-601'
        uses: actions/upload-artifact@v7
        with:
          name: bitaxe-gamma-601-experimental-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*/bitaxe-gamma-601-factory.bin
            release/*/bitaxe-gamma-601-firmware.bin
            release/*/SHA256SUMS.txt
            docs/hardware/bitaxe-gamma-601.md

      - name: M5StickC Plus2 dashboard test build
        if: matrix.env == 'm5stickc-plus2'
        uses: actions/upload-artifact@v7
        with:
          name: m5stickc-plus2-dashboard-test-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*/m5stickc-plus2-factory.bin
            release/*/m5stickc-plus2-firmware.bin
            release/*/SHA256SUMS.txt
            docs/audits/2026-10-27-m5-dashboard-load.md
