# Publishes the site (installer/) on GitHub Pages when it changes on main,
# with the latest release's factory images: no new release is needed to fix
# a page. A release publishes the site of its tag (release.yml); this one runs
# again after it, so that changes made on main since the tag stay online.
name: Site

on:
  push:
    branches: [main]
    paths: ["installer/**", "web/**", "tools/bdlhost/web/**", "tools/make_installer.py", "tools/make_site_demo.py", "tools/make_channels.py", "tools/release_version.py", ".github/workflows/site.yml"]
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [Release V2]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_branch, 'release/prepare-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stable installer and opt-in beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/make_channels.py --repository "$GITHUB_REPOSITORY" --output site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
