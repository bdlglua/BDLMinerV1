# Build workers never receive the signing key. Only the aggregate job signs.
name: Release V2
on:
  push:
    tags: ["v*"]
    branches: ["release/prepare-*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      envs: ${{ steps.meta.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: meta
        name: Validate tag and channel
        run: |
          python3 - <<'PYMETA'
          import json, os, sys
          sys.path.insert(0, 'tools')
          from release_version import Version
          from make_release import envs
          tag = os.environ['GITHUB_REF_TYPE'] == 'tag'
          ref = os.environ['GITHUB_REF_NAME']
          version = Version(ref[1:] if tag else ref.removeprefix('release/prepare-'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + version.text + '\n')
              out.write('draft=' + str(not tag).lower() + '\n')
              out.write('prerelease=' + str(version.prerelease).lower() + '\n')
              out.write('envs=' + json.dumps(envs()) + '\n')
          PYMETA
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/web/package-lock.json
      - run: npm ci --prefix test/web
      - run: test/web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix test/web
      - run: node test/web/test_hub.cjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pip install platformio==6.2.0
      - run: python3 -m unittest discover -s test/tools -v
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: ./test/host/run.sh
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.prepare.outputs.envs) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-release-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-release-${{ runner.os }}-${{ matrix.env }}-
      - run: pip install platformio==6.2.0
      # pioarduino hybrid compile, as in ci.yml: the first run rebuilds ESP-IDF
      # with custom_sdkconfig and copies it into the framework. Its own child
      # build may be refused (pioarduino's penv can carry PlatformIO
      # 6.2.0.post1, read as 6.2.0-post.1 < 6.2.0); the libraries are in place
      # by then, so the packaging below builds against them as usual.
      - name: Rebuild ESP-IDF for this board (custom_sdkconfig)
        run: pio run -e "${{ matrix.env }}" > build-idf.log 2>&1 || tail -40 build-idf.log
      - name: Unsigned board build
        run: python3 tools/make_release.py --unsigned --version "$VERSION" "${{ matrix.env }}"
      - name: Native physical display checks
        if: matrix.env == 'm5stickc-plus2'
        run: python3 tools/preview_display.py --check
      - name: Native Gamma display checks
        if: matrix.env == 'bitaxe-gamma-601'
        run: python3 tools/preview_gamma_display.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.env }}
          path: release/${{ env.VERSION }}/*
          if-no-files-found: error
          retention-days: 7
  sign:
    needs: [prepare, web, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: unsigned-*
          path: build-inputs
      - name: Validate all images and sign centrally
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "Release signing key is missing"; exit 1; }
          umask 077
          RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/release-signing-key.pem"
          export RELEASE_SIGNING_KEY_FILE
          trap 'rm -f "$RELEASE_SIGNING_KEY_FILE"' EXIT
          printf '%s\n' "$KEY" > "$RELEASE_SIGNING_KEY_FILE"
          python3 tools/assemble_release.py --inputs build-inputs --version "$VERSION"
      - name: Package the Linux fleet hub and hardware tools
        run: python3 tools/make_beta_bundle.py --release "release/$VERSION" --output .pio/v2-linux-kit --archive "release/$VERSION/BDLMiner-$VERSION-Linux-kit.zip"
      - name: Release notes
        run: |
          NOTES="docs/releases/v$VERSION.md"
          if [ -f "$NOTES" ]; then echo "RELEASE_NOTES_PATH=$NOTES" >> "$GITHUB_ENV"; fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: BDLMiner ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: true
          files: release/${{ env.VERSION }}/*
      - uses: actions/upload-artifact@v7
        with:
          name: signed-firmware-${{ env.VERSION }}
          path: release/${{ env.VERSION }}/*
          retention-days: 14
  installer:
    needs: [prepare, sign]
    if: needs.prepare.outputs.draft == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stable root and opt-in beta channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/make_channels.py --repository "$GITHUB_REPOSITORY" --output site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  pages:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
