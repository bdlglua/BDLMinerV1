# Pushing a tag vX.Y.Z builds firmware X.Y.Z for every board, signs it,
# publishes it as a GitHub release (which miners update from) and puts the
# web installer on GitHub Pages.
#
# Needs the secret RELEASE_SIGNING_KEY (the content of
# keys/release-signing-key.pem), Pages set to "GitHub Actions" and the
# github-pages environment allowing the tags v* to deploy.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/web/package-lock.json
      - run: npm ci --prefix test/web
      - run: test/web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix test/web

  release:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-release-${{ runner.os }}-
      - run: pip install platformio==6.1.19

      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "tag must be vX.Y.Z"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: python3 -m unittest discover -s test/tools -v
      - name: Native SV2 crypto test dependency
        run: |
          if ! python3 -c 'import ctypes.util; assert ctypes.util.find_library("sodium")'; then
            sudo apt-get update
            sudo apt-get install -y libsodium23
          fi
      - run: ./test/host/run.sh

      - name: Signing key
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "secret RELEASE_SIGNING_KEY is missing: miners would refuse this release"; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          echo "RELEASE_SIGNING_KEY_FILE=$RUNNER_TEMP/release-signing-key.pem" >> "$GITHUB_ENV"

      - run: python3 tools/make_release.py --version "$VERSION"

      - name: Every firmware is signed
        run: |
          for f in release/$VERSION/*-firmware.bin; do [ -f "$f.sig" ] || { echo "missing $f.sig"; exit 1; }; done

      - run: rm -f "$RELEASE_SIGNING_KEY_FILE"
        if: always()

      - name: Release notes
        run: |
          NOTES="docs/releases/v$VERSION.md"
          if [ -f "$NOTES" ]; then
            echo "RELEASE_NOTES_PATH=$NOTES" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: BDLMiner V1 ${{ env.VERSION }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: true
          files: release/${{ env.VERSION }}/*

      - run: python3 tools/make_installer.py "release/$VERSION" site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Separate job: a Pages problem must not keep the release from being
  # published (the github-pages environment has to allow v* tags).
  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
